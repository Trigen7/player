<!doctype html>
<html><head><meta charset="utf-8"><title>player</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#p{width:100vw;height:100vh}</style></head>
<body><div id="p"></div>
<script>
var id = new URLSearchParams(location.search).get('v');
var player, vol = 70;
function send(o){ try{ parent.postMessage(o,'*'); }catch(e){} }
var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('p', {
    videoId: id, width:'100%', height:'100%',
    playerVars:{autoplay:1, mute:1, loop:1, playlist:id, controls:0, playsinline:1, origin:location.origin},
    events:{
      onReady:function(e){ e.target.playVideo(); setTimeout(function(){ e.target.unMute(); e.target.setVolume(vol); e.target.playVideo(); },300); send({zPlayer:'ready'}); },
      onError:function(e){ send({zPlayer:'error', code:e.data}); }
    }
  });
};
window.addEventListener('message', function(e){
  var d = e.data; if(!d || !player || !player.setVolume) return;
  if(d.zCmd === 'volume'){ vol = d.value; player.setVolume(vol); }
  if(d.zCmd === 'unmute'){ player.unMute(); player.setVolume(vol); player.playVideo(); }
});
</script></body></html>
